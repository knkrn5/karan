spring.application.name=java-backend
server.port=9090

# PostgreSQL Database Configuration
spring.datasource.url=${PSQL_DB_HOST_URL}
spring.datasource.username=${PSQL_DB_USERNAME}
spring.datasource.password=${PSQL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true


#spring emailer
spring.mail.host=${MAIL_HOST}
spring.mail.port=465
spring.mail.username=${MAIL_FROM}
spring.mail.password=${MAIL_PASS}
# spring.mail.protocol=smtp

# These two are **not needed** for SSL on port 465 and may cause issues
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true



# Instead, use SSL config:
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.zoho.in
