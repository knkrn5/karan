<svg width="100" height="100" viewBox="0 0 200 200"
    xmlns="http://www.w3.org/2000/svg">
          {/*         <!-- Gradient definitions --> */}
    <defs>
        <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#6366f1" />
            <stop offset="50%" stopColor="#8b5cf6" />
            <stop offset="100%" stopColor="#ec4899" />
        </linearGradient>

        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#f59e0b" />
            <stop offset="50%" stopColor="#ef4444" />
            <stop offset="100%" stopColor="#8b5cf6" />
        </linearGradient>

            {/*                 <!-- Filter for glow effect --> */}
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

            {/*                 <!-- Animation for pulsing --> */}
        <animate id="pulseAnimation" attributeName="r" from="40" to="45" dur="2s" begin="0s" repeatCount="indefinite" />
    </defs>

          {/*         <!-- Background circle with gradient and animation --> */}
    <circle cx="100" cy="100" r="80" fill="url(#circleGradient)">
        <animate attributeName="r" values="80;85;80" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
    </circle>

          {/*         <!-- Inner circle --> */}
    <circle cx="100" cy="100" r="70" fill="#ffffff" opacity="0.3">
        <animate attributeName="r" values="70;75;70" dur="4s" repeatCount="indefinite" />
    </circle>

          {/*         <!-- Decorative rings --> */}
    <circle cx="100" cy="100" r="90" fill="none" stroke="url(#textGradient)" strokeWidth="3" opacity="0.7">
        <animate attributeName="stroke-dashoffset" from="0" to="502" dur="20s" repeatCount="indefinite" />
        <animate attributeName="stroke-dasharray" values="5,15;10,10;15,5" dur="10s" repeatCount="indefinite" />
    </circle>

          {/*         <!-- Letter with gradient and glow --> */}
    <text x="50%" y="55%" fontSize="80" fontFamily="Arial, sans-serif" fontWeight="bold" fill="url(#textGradient)" textAnchor="middle" dominantBaseline="middle" filter="url(#glow)">
            {letter}
        <animate attributeName="font-size" values="80;82;80" dur="2s" repeatCount="indefinite" />
    </text>

          {/*         <!-- Decorative particles --> */}
    <g>
        <circle cx="130" cy="70" r="4" fill="#f59e0b">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="70" cy="130" r="4" fill="#60a5fa">
            <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="150" cy="120" r="3" fill="#f472b6">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="50" cy="70" r="3" fill="#34d399">
            <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>


